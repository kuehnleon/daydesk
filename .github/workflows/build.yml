name: Build and Push

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master]

# Cancel superseded PR runs; give each tag its own group so releases never
# cancel each other mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: daydesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # All static env values live in .env.test (checked into the repo).
      # Playwright's config loads it. Only truly-per-run values live here.
      PLAYWRIGHT_USE_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate throwaway VAPID keys
        run: |
          node -e "const k=require('web-push').generateVAPIDKeys();\
            console.log('VAPID_PUBLIC_KEY='+k.publicKey);\
            console.log('VAPID_PRIVATE_KEY='+k.privateKey);" >> "$GITHUB_ENV"

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload visual regression baselines + diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          # The committed baselines (always) + any actual/diff PNGs written
          # by failing visual tests (only present on failure).
          path: |
            e2e/tests/visual-regression.spec.ts-snapshots/**
            test-results/**/visual-regression*/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  build-docker:
    name: Build Docker Image
    needs: [lint, test, e2e]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          # Push only on tag pushes; PR builds are smoke-tests, kept local.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version || 'pr' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || format('pr-{0}', github.event.pull_request.number) }}

  build-helm:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Update Chart version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version:.*/version: $VERSION/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" helm/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm

      - name: Push Helm chart to OCI Registry
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          helm push daydesk-${VERSION}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-helm
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest \
            --verify-tag

          EXISTING=$(gh release view "v${VERSION}" --json body -q .body)
          printf '%s\n\n## Artifacts\n\n**Docker image:**\n```\ndocker pull %s/%s:%s\n```\n\n**Helm chart:**\n```\nhelm pull oci://%s/%s/charts/daydesk --version %s\n```\n' \
            "$EXISTING" \
            "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" "$VERSION" \
            "${{ env.REGISTRY }}" "${{ github.repository_owner }}" "$VERSION" \
            > notes.md

          gh release edit "v${VERSION}" --notes-file notes.md
