services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=daydesk
      - POSTGRES_PASSWORD=daydesk
      - POSTGRES_DB=daydesk
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Disposable Postgres for the e2e test suite. Uses host port 5433 so it can
  # run alongside the dev `postgres` service (5432). `.env.test` targets 5433.
  #
  # Start with: `docker compose --profile e2e up -d postgres-e2e`
  # Stop with:  `docker compose --profile e2e stop postgres-e2e`
  #             `docker compose --profile e2e rm -f postgres-e2e`  (also wipes data)
  postgres-e2e:
    profiles: ["e2e"]
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=daydesk_test
    # Ephemeral — no volume mount, so `rm` wipes it.

  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate dev && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://daydesk:daydesk@postgres:5432/daydesk
      - APP_BASE_URL=http://localhost:3000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - OAUTH_ISSUER=${OAUTH_ISSUER}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:dev@localhost}
      - PUSH_API_SECRET=${PUSH_API_SECRET:-dev-secret}
      - LOG_LEVEL=${LOG_LEVEL:-debug}

volumes:
  pgdata:
